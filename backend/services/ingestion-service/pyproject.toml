[project]
name = "ingestion-service"
version = "0.1.0"
description = "Documents folder -> chunks -> vectors in Qdrant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "adhikar-common",
  "pyyaml>=6",
  "pypdf>=4",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "qdrant-client>=1.15,<1.16",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "openapi-spec-validator>=0.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx2.*", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
