# Golden profiles. must_include: schemes that MUST be surfaced (recommendations + more).
# must_not_include: schemes that must NEVER be surfaced (wrong state, wrong occupation, superseded ...).
# Seeded from the Flutter engine tests (test/widget_test.dart) and the eligibility parity fixtures.
- id: mh_woman_low_income
  notes: Maharashtra woman, family income under 1 lakh -> Ladki Bahin
  profile: {state: Maharashtra, gender: Female, age: 30, annualIncomeRange: "< 1 Lakh"}
  must_include: [mh_ladki_bahin]
  must_not_include: [wb_annapurna_bhandar, rj_maa_ayushman, pm_kisan]

