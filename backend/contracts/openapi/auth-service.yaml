openapi: 3.1.0
info:
  title: auth-service
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /.well-known/jwks.json:
    get:
      summary: Jwks
      operationId: jwks__well_known_jwks_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Jwks  Well Known Jwks Json Get
  /v1/auth/otp/request:
    post:
      summary: Otp Request
      operationId: otp_request_v1_auth_otp_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequested'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/auth/signup:
    post:
      summary: Signup
      operationId: signup_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/auth/login:
    post:
      summary: Login
      operationId: login_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/auth/login/otp:
    post:
      summary: Login Otp
      operationId: login_otp_v1_auth_login_otp_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/auth/token/refresh:
    post:
      summary: Refresh
      operationId: refresh_v1_auth_token_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/auth/logout:
    post:
      summary: Logout
      operationId: logout_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout-all:
    post:
      summary: Logout All
      operationId: logout_all_v1_auth_logout_all_post
      responses:
        '204':
          description: Successful Response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/users/me:
    get:
      summary: Me
      operationId: me_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
    delete:
      summary: Delete Me
      operationId: delete_me_v1_users_me_delete
      responses:
        '204':
          description: Successful Response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
    patch:
      summary: Update Me
      operationId: update_me_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
components:
  schemas:
    ErrorOut:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OtpLogin:
      properties:
        email:
          type: string
          format: email
          title: Email
        code:
          type: string
          pattern: ^\d{6}$
          title: Code
      type: object
      required:
      - email
      - code
      title: OtpLogin
    OtpRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        purpose:
          type: string
          enum:
          - signup
          - login
          title: Purpose
          default: login
      type: object
      required:
      - email
      title: OtpRequest
    OtpRequested:
      properties:
        status:
          type: string
          const: accepted
          title: Status
          default: accepted
        message:
          type: string
          title: Message
          default: If the address can receive a code, one has been sent.
        resend_after:
          type: integer
          title: Resend After
      type: object
      required:
      - resend_after
      title: OtpRequested
    PasswordLogin:
      properties:
        identifier:
          type: string
          maxLength: 254
          minLength: 3
          title: Identifier
          description: email or phone number
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      type: object
      required:
      - identifier
      - password
      title: PasswordLogin
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 200
          minLength: 20
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    SignupRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        code:
          type: string
          pattern: ^\d{6}$
          title: Code
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        state:
          type: string
          maxLength: 64
          title: State
          default: All India
        socialCategory:
          type: string
          maxLength: 16
          title: Socialcategory
          default: General
        occupation:
          type: string
          maxLength: 64
          title: Occupation
          default: Citizen
      additionalProperties: false
      type: object
      required:
      - email
      - code
      - password
      - name
      title: SignupRequest
    TokenPair:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        refresh_token:
          type: string
          title: Refresh Token
        refresh_expires_in:
          type: integer
          title: Refresh Expires In
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
      - access_token
      - expires_in
      - refresh_token
      - refresh_expires_in
      - user
      title: TokenPair
    UserOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        name:
          type: string
          title: Name
        state:
          type: string
          title: State
        social_category:
          type: string
          title: Social Category
        occupation:
          type: string
          title: Occupation
        profile:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Profile
        is_verified:
          type: boolean
          title: Is Verified
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - email
      - phone
      - name
      - state
      - social_category
      - occupation
      - profile
      - is_verified
      - created_at
      title: UserOut
    UserUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        state:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: State
        socialCategory:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Socialcategory
        occupation:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Occupation
        profile:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Profile
      additionalProperties: false
      type: object
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
