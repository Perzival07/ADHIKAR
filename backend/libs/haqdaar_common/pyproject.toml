[project]
name = "haqdaar-common"
version = "0.1.0"
description = "Logging, request-id and redaction helpers shared by Haqdaar services (no business logic)."
requires-python = ">=3.11"
dependencies = ["starlette>=0.37", "httpx>=0.27", "redis>=5.0", "pyjwt[crypto]>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haqdaar_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx2.*"]
