---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: adhikar-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: adhikar.slo
    rules:
    - alert: AdhikarApiErrorRateHigh
      for: 10m
      labels:
        severity: page
      expr: sum(rate(adhikar_http_requests_total{service=~"recommendation-service|auth-service",status=~"5.."}[5m])) / sum(rate(adhikar_http_requests_total{service=~"recommendation-service|auth-service"}[5m]))
        > 0.02
      annotations:
        summary: More than 2% of public API requests fail with 5xx
    - alert: AdhikarRecommendationLatencyHigh
      for: 15m
      labels:
        severity: ticket
      expr: histogram_quantile(0.95, sum by (le) (rate(adhikar_http_request_duration_seconds_bucket{route="/v1/recommendations"}[5m])))
        > 20
      annotations:
        summary: p95 recommendation latency above 20 s (LLM saturated? add model servers)
    - alert: AdhikarRulesOnlyFallbackHigh
      for: 15m
      labels:
        severity: ticket
      expr: sum(rate(reco_fallback_total[10m])) / sum(rate(reco_requests_total[10m])) > 0.25
      annotations:
        summary: 'Over 25% of answers are rules-only: LLM or retrieval degraded'
    - alert: AdhikarCircuitOpen
      for: 0m
      labels:
        severity: ticket
      expr: increase(reco_circuit_open_total[5m]) > 0
      annotations:
        summary: A downstream dependency tripped its circuit breaker
    - alert: AdhikarLlmQueueRejections
      for: 10m
      labels:
        severity: ticket
      expr: sum(rate(llmgw_queue_rejections_total[5m])) > 0.5
      annotations:
        summary: 'LLM gateway is shedding load: scale model servers'
    - alert: AdhikarIngestFailed
      for: 0m
      labels:
        severity: ticket
      expr: kube_job_status_failed{namespace="adhikar",job_name=~"ingest.*"} > 0
      annotations:
        summary: Scheme document ingestion job failed
