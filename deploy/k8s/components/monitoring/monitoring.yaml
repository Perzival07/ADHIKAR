# Requires the Prometheus Operator (kube-prometheus-stack). Alert thresholds are starting points; tune to your SLOs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: recommendation-service
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    bearerTokenSecret:
      name: reco-secrets
      key: RECO_METRICS_TOKEN

