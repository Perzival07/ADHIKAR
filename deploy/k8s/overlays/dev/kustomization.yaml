# Local cluster (k3s / kind / minikube). Secrets come from secrets/*.env, generated by `make k8s-dev-secrets` (git-ignored).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haqdaar
resources:
- ../../base
components:
- ../../components/postgres-dev
configMapGenerator:
- name: haqdaar-config
  behavior: merge
  literals:
  - AUTH_ENV=development
  - AUTH_EMAIL_BACKEND=console
  - AUTH_SEED_DEMO_USERS=true
  - AUTH_CORS_ORIGINS=*
  - RECO_CORS_ORIGINS=*
secretGenerator:
- name: auth-secrets
  envs:
  - secrets/auth.env
- name: reco-secrets
  envs:
  - secrets/reco.env
- name: haqdaar-shared
  envs:
  - secrets/shared.env
- name: postgres-dev
  envs:
  - secrets/postgres.env
images:
- name: ghcr.io/haqdaar/auth-service
  newName: haqdaar/auth-service
  newTag: local
- name: ghcr.io/haqdaar/recommendation-service
  newName: haqdaar/recommendation-service
  newTag: local
- name: ghcr.io/haqdaar/eligibility-service
  newName: haqdaar/eligibility-service
  newTag: local
- name: ghcr.io/haqdaar/retrieval-service
  newName: haqdaar/retrieval-service
  newTag: local
- name: ghcr.io/haqdaar/embedding-service
  newName: haqdaar/embedding-service
  newTag: local
- name: ghcr.io/haqdaar/llm-gateway
  newName: haqdaar/llm-gateway
  newTag: local
- name: ghcr.io/haqdaar/ingestion-service
  newName: haqdaar/ingestion-service
  newTag: local
- name: ghcr.io/haqdaar/scheme-docs
  newName: haqdaar/scheme-docs
  newTag: local
patches:
- target:
    kind: Deployment
    name: recommendation-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
- target:
    kind: Deployment
    name: auth-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
- target:
    kind: Deployment
    name: eligibility-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
- target:
    kind: Deployment
    name: retrieval-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
- target:
    kind: Deployment
    name: embedding-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
- target:
    kind: Deployment
    name: llm-gateway
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
- target:
    kind: HorizontalPodAutoscaler
    name: recommendation-service
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path: /spec/maxReplicas\n  value: 3\n"
- target:
    kind: HorizontalPodAutoscaler
    name: auth-service
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path: /spec/maxReplicas\n  value: 3\n"
- target:
    kind: HorizontalPodAutoscaler
    name: eligibility-service
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path: /spec/maxReplicas\n  value: 3\n"
- target:
    kind: HorizontalPodAutoscaler
    name: retrieval-service
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path: /spec/maxReplicas\n  value: 3\n"
- target:
    kind: HorizontalPodAutoscaler
    name: embedding-service
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path: /spec/maxReplicas\n  value: 3\n"
- target:
    kind: PodDisruptionBudget
    name: ^(recommendation|auth|eligibility|retrieval|embedding)-service$
  patch: "- op: replace\n  path: /spec/minAvailable\n  value: 0\n"
- target:
    kind: Ingress
    name: haqdaar-api
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: api.haqdaar.localhost\n- op: remove\n  path: /spec/tls\n- op:\
    \ replace\n  path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect\n  value: \"false\"\n"
