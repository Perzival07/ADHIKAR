# Provider-neutral LLM access. Scale with the number of model servers (GPUs), not CPU: see docs/scaling.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8001'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: haqdaar-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: llm-gateway
      initContainers: []
      containers:
      - name: llm-gateway
        image: ghcr.io/haqdaar/llm-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
        envFrom:
        - configMapRef:
            name: haqdaar-config
        env:
        - name: PORT
          value: '8001'
        - name: WEB_CONCURRENCY
          value: '2'
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: models
          mountPath: /config
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: models
        configMap:
          name: llm-models

---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
  - name: http
    port: 8001
    targetPort: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/component: backend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
