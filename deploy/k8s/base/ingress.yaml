# Only public routes are exposed. /metrics and /v1/admin are NOT routed: reach them in-cluster only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adhikar-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: edge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/proxy-read-timeout: '120'
    nginx.ingress.kubernetes.io/limit-rps: '20'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.adhikar.example
    secretName: api-tls
  rules:
  - host: api.adhikar.example
    http:
      paths:
      - path: /v1/recommendations
        pathType: Prefix
        backend:
          service:
            name: recommendation-service
            port:
              name: http
      - path: /v1/explain
        pathType: Prefix
        backend:
          service:
            name: recommendation-service
            port:
              name: http
      - path: /v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              name: http
      - path: /v1/users
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              name: http
      - path: /.well-known/jwks.json
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              name: http
