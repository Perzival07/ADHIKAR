# Vector store. Single node is fine for ~millions of chunks; for HA use Qdrant distributed mode or Qdrant Cloud.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: datastore
spec:
  serviceName: qdrant-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/component: datastore
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.15.0-unprivileged
        ports:
        - name: http
          containerPort: 6333
        - name: grpc
          containerPort: 6334
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: storage
          mountPath: /qdrant/storage
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: datastore
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: datastore
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
  - name: http
    port: 6333
