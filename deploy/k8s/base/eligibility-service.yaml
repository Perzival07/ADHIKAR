# Deterministic rules. Scheme metadata comes from the versioned scheme-docs data image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eligibility-service
  labels:
    app.kubernetes.io/name: eligibility-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: eligibility-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eligibility-service
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8005'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: adhikar-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: eligibility-service
      initContainers:
      - name: scheme-docs
        image: ghcr.io/adhikar/scheme-docs:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: docs
          mountPath: /target
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id001
            drop:
            - ALL
          runAsUser: 10001
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      containers:
      - name: eligibility-service
        image: ghcr.io/adhikar/eligibility-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8005
        envFrom:
        - configMapRef:
            name: adhikar-config
        env:
        - name: PORT
          value: '8005'
        - name: WEB_CONCURRENCY
          value: '2'
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id001
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: docs
          mountPath: /data/scheme_docs
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: docs
        emptyDir:
          sizeLimit: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: eligibility-service
  labels:
    app.kubernetes.io/name: eligibility-service
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: eligibility-service
  ports:
  - name: http
    port: 8005
    targetPort: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eligibility-service
  labels:
    app.kubernetes.io/name: eligibility-service
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eligibility-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eligibility-service
  labels:
    app.kubernetes.io/name: eligibility-service
    app.kubernetes.io/component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eligibility-service
